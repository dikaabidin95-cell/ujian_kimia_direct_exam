<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ujian Kimia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f8ff;
      color: #000000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .erlenmeyer-icon {
      width: 58px;
      height: 68px;
      margin: 0 auto 10px;
      color: #168a43;
    }

    .erlenmeyer-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.15;
    }

    .school {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 17px;
      color: #666666;
    }

    .status {
      margin-top: 30px;
      padding: 24px;
      background: #ffffff;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 700;
    }
    #reader {
  width: 100%;
  max-width: 420px;
  margin: 24px auto 0;
  border-radius: 18px;
  overflow: hidden;
  background: #ffffff;
}

#reader video {
  width: 100% !important;
  border-radius: 18px;
}

#scanStartOverlay {
  margin-top: 16px;
  text-align: center;
}

#startScanBtn {
  border: none;
  border-radius: 14px;
  padding: 16px 28px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  background: #168a43;
  color: #ffffff;
}

#hasil {
  margin-top: 18px;
  font-size: 18px;
  font-weight: 700;
}
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

  <main class="app">

    <div class="erlenmeyer-icon">
      <svg
        viewBox="0 0 100 120"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="Labu Erlenmeyer"
      >
        <path
          d="M38 8 H62 V38 L82 91
             C86 102 78 112 67 112
             H33 C22 112 14 102 18 91
             L38 38 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
          stroke-linejoin="round"
        />

        <path
          d="M25 82 H75"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
        />

        <path
          d="M28 75
             C39 70 61 70 72 75"
          fill="none"
          stroke="currentColor"
          stroke-width="4"
        />
      </svg>
    </div>

    <h1>Ujian Kimia</h1>

    <div class="school">
      SMAN 4 TASIKMALAYA
    </div>

    <div class="subtitle">
      Direct Exam
    </div>

    <div class="status">
      SISTEM SIAP
    </div>
<div id="reader"></div>

<div id="scanStartOverlay">
  <button type="button" id="startScanBtn">
    MULAI SCAN →
  </button>
</div>

<div id="hasil"></div>
  </main>
<script>
  let scanner = null;
  let scanDiizinkan = false;
  let sedangMemproses = false;

  const startScanBtn =
    document.getElementById("startScanBtn");

  const overlay =
    document.getElementById("scanStartOverlay");

  const hasil =
    document.getElementById("hasil");

  startScanBtn.addEventListener("click", function () {

    scanDiizinkan = true;
    startScanBtn.disabled = true;
    startScanBtn.innerText = "MEMBUKA KAMERA...";

    if (!document.fullscreenElement &&
        document.documentElement.requestFullscreen) {

      document.documentElement
        .requestFullscreen()
        .catch(function () {});
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      function (decodedText) {

  if (!scanDiizinkan) {
    return;
  }

  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  const nis = String(decodedText || "").trim();

  hasil.innerHTML = `
    <div>
      MENCATAT NIS...
    </div>
    <div style="margin-top:8px;font-size:26px;">
      ${nis}
    </div>
  `;

  scanner.stop()
    .catch(function () {});

  const apiUrl =
    "https://script.google.com/macros/s/AKfycbwxeW6ZSki-s_3m04SUolyJ_Q1zEbGTgNNDDE4J4GVEV-gAyvJaspzzcLRhCFw5OE1yow/exec";

   const namaCallback =
    "catatUjianCallback_" + Date.now();

  const hasilCatatUjian =
    new Promise(function (resolve, reject) {

      window[namaCallback] = function (data) {

        delete window[namaCallback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        resolve(data);
      };

      const script =
        document.createElement("script");

      script.src =
        apiUrl +
        "?mode=catat_ujian&id=" +
        encodeURIComponent(nis) +
        "&callback=" +
        encodeURIComponent(namaCallback);

      script.onerror = function () {

        delete window[namaCallback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(new Error("Gagal menghubungi server."));
      };

      document.body.appendChild(script);
    });

  hasilCatatUjian
    .then(function (hasilUjian) {

      // ================================================
      // SISWA SUDAH TERCATAT PADA SESI INI
      // ================================================
      if (
        !hasilUjian ||
        hasilUjian.berhasil !== true
      ) {

        sedangMemproses = false;
        scanDiizinkan = false;

        hasil.innerHTML = `
          <div style="
            font-size:30px;
            font-weight:800;
            margin-bottom:18px;
          ">
            PERINGATAN
          </div>

          <div style="
            font-size:21px;
            font-weight:700;
            line-height:1.5;
          ">
            ${hasilUjian && hasilUjian.status === "SUDAH_TERVERIFIKASI"
              ? "ANDA SUDAH TERCATAT PADA SESI UJIAN INI"
              : "IDENTITAS TIDAK DAPAT DIPROSES"}
          </div>

          <div style="
            margin-top:16px;
            font-size:16px;
            line-height:1.5;
          ">
            ${hasilUjian && hasilUjian.status === "SUDAH_TERVERIFIKASI"
              ? "Anda tidak dapat masuk ke ujian kembali."
              : "Silakan tunggu arahan dari guru."}
          </div>
        `;

        return;
      }

      // ================================================
      // SISWA BERHASIL TERCATAT
      // LANJUT KE PEMERIKSAAN WAKTU UJIAN
      // ================================================

      hasil.innerHTML = `
        <div>
          NIS TERCATAT
        </div>
        <div style="margin-top:8px;font-size:26px;">
          ${nis}
        </div>
        <div style="margin-top:16px;">
          MEMERIKSA WAKTU UJIAN...
        </div>
      `;

      // ===================================================
      // AMBIL WAKTU SERVER
      // ===================================================

  hasil.innerHTML = `
    <div>
      NIS TERCATAT
    </div>
    <div style="margin-top:8px;font-size:26px;">
      ${nis}
    </div>
    <div style="margin-top:16px;">
      MEMERIKSA WAKTU UJIAN...
    </div>
  `;

  // ===================================================
  // AMBIL WAKTU SERVER
  // ===================================================

  const callbackName =
    "waktuUjian_" + Date.now();

  window[callbackName] = function (data) {

const callbackUjian = window[callbackName];

// Hapus callback
delete window[callbackName];
    if (!data || !data.mulai || !data.selesai) {

      hasil.innerHTML = `
        <div style="color:#c62828;">
          WAKTU UJIAN TIDAK DAPAT DIVERIFIKASI
        </div>
      `;

      sedangMemproses = false;
      return;
    }

    const sekarang =
      data.serverTime;

    const mulai =
      data.mulai;

    const selesai =
      data.selesai;

    // =================================================
    // BELUM WAKTUNYA
    // =================================================

    if (sekarang < mulai) {

  const offsetServer =
    sekarang - Date.now();

  function updateCountdownSebelumMulai() {

    const sekarangServer =
      Date.now() + offsetServer;

    const selisih =
      mulai - sekarangServer;

    if (selisih <= 0) {

  callbackUjian({
    serverTime: mulai,
    mulai: mulai,
    selesai: selesai
  });

  return;
}

    const jam =
      Math.floor(selisih / 3600000);

    const menit =
      Math.floor(
        (selisih % 3600000) / 60000
      );

    const detik =
      Math.floor(
        (selisih % 60000) / 1000
      );

    hasil.innerHTML = `
      <div>
        UJIAN BELUM DIMULAI
      </div>

      <div style="
        margin-top:12px;
        font-size:26px;
      ">
        ${String(jam).padStart(2, "0")}:
        ${String(menit).padStart(2, "0")}:
        ${String(detik).padStart(2, "0")}
      </div>

      <div style="
        margin-top:8px;
        font-size:14px;
        font-weight:500;
      ">
        Ujian dimulai 13.45 WIB
      </div>
    `;

    setTimeout(
      updateCountdownSebelumMulai,
      1000
    );
  }

  updateCountdownSebelumMulai();

  sedangMemproses = false;
  return;
}
    if (sekarang >= selesai) {

      hasil.innerHTML = `
        <div style="color:#c62828;">
          UJIAN SUDAH BERAKHIR
        </div>
      `;

      sedangMemproses = false;
      return;
    }
  
    // =================================================
    // UJIAN AKTIF
    // =================================================

    const formUrl =
  "https://docs.google.com/forms/d/e/1FAIpQLSehuMRYjcZxvMPSbCx6-lsocNbBHkgqUOiAvP5cKxKoxd8YlQ/viewform" +
  "?usp=pp_url&entry.2090469524=" +
  encodeURIComponent(nis);


    document.body.innerHTML = `

      <div id="ujianContainer"
        style="
          position:fixed;
          inset:0;
          width:100vw;
          height:100vh;
          margin:0;
          padding:0;
          background:#f3f8ff;
          overflow:hidden;
          z-index:99999;
        ">

        <iframe
          src="${formUrl}"
          allow="fullscreen; autoplay"
          allowfullscreen
          style="
            display:block;
            width:100%;
            height:100%;
            border:none;
            margin:0;
            padding:0;
          ">
        </iframe>

        <div id="countdownUjian"
          style="
            position:fixed;
            top:10px;
            right:10px;
            z-index:100000;
            background:rgba(0,0,0,0.78);
            color:#ffffff;
            padding:8px 12px;
            border-radius:12px;
            font-size:15px;
            font-weight:800;
            line-height:1;
            box-shadow:0 3px 10px rgba(0,0,0,0.25);
          ">
          60:00
        </div>

      </div>
    `;

        // =================================================
    // DETEKSI MENINGGALKAN HALAMAN UJIAN
    // =================================================

    let jumlahPelanggaran = 0;
    let halamanMeninggalkanUjian = false;
    let fullscreenPeringatanAktif = false;
    function tampilkanPeringatanFullscreen() {

  if (fullscreenPeringatanAktif) {
    return;
  }

  fullscreenPeringatanAktif = true;

  const overlayFullscreen =
    document.createElement("div");

  overlayFullscreen.id =
    "overlayPeringatanFullscreen";

  overlayFullscreen.style.cssText = `
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:Arial,sans-serif;
    z-index:9999999;
    padding:24px;
    box-sizing:border-box;
  `;

  overlayFullscreen.innerHTML = `
    <div style="
      width:100%;
      max-width:460px;
    ">

      <div style="
        font-size:28px;
        font-weight:800;
        line-height:1.4;
        margin-bottom:20px;
      ">
        ANDA KELUAR DARI MODE FULLSCREEN
      </div>

      <div style="
        font-size:18px;
        font-weight:500;
        line-height:1.6;
        margin-bottom:30px;
      ">
        Silakan kembali ke mode fullscreen
        untuk melanjutkan ujian.
      </div>

      <button
        id="tombolKembaliFullscreen"
        style="
          border:none;
          border-radius:10px;
          padding:16px 24px;
          font-size:17px;
          font-weight:800;
          cursor:pointer;
        "
      >
        KEMBALI KE FULLSCREEN
      </button>

    </div>
  `;

  document.body.appendChild(
    overlayFullscreen
  );

  document.getElementById(
    "tombolKembaliFullscreen"
  ).addEventListener(
    "click",
    function () {

      document.documentElement
        .requestFullscreen()
        .then(function () {

          fullscreenPeringatanAktif =
            false;

          overlayFullscreen.remove();

        })
        .catch(function () {

          // Tetap tampil.
          // Siswa harus menekan tombol
          // kembali setelah fullscreen
          // dapat diaktifkan.

        });

    }
  );
}
    document.addEventListener(
  "fullscreenchange",
  function () {

    if (
      document.fullscreenElement === null &&
      document.visibilityState === "visible" &&
      document.getElementById(
        "ujianContainer"
      )
    ) {

      tampilkanPeringatanFullscreen();

    }

  }
);

    function tampilkanPeringatanUjian() {

      jumlahPelanggaran++;

  if (jumlahPelanggaran > 3) {

    document.body.innerHTML = `
      <div style="
        position:fixed;
        inset:0;
        width:100vw;
        height:100vh;
        background:#f3f8ff;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        font-family:Arial,sans-serif;
        z-index:999999;
        padding:24px;
      ">
        <div style="
          width:100%;
          max-width:460px;
        ">

          <div style="
            font-size:30px;
            font-weight:800;
            margin-bottom:18px;
          ">
            UJIAN DIAKHIRI
          </div>

          <div style="
            font-size:19px;
            font-weight:600;
            line-height:1.5;
          ">
            Ujian dihentikan karena Anda
telah melalaikan 3 kali peringatan.
          </div>

          <div style="
            margin-top:14px;
            font-size:16px;
            line-height:1.5;
          ">
            Jawaban Anda tidak tersimpan
          </div>

          <div style="
            margin-top:20px;
            font-size:16px;
            font-weight:700;
          ">
            Silakan tunggu arahan dari Guru.
          </div>

        </div>
      </div>
    `;

    return;
  }
      
      const overlayPeringatan =
        document.createElement("div");

      overlayPeringatan.id =
        "overlayPeringatanUjian";

      overlayPeringatan.style.cssText = `
        position:fixed;
        inset:0;
        width:100vw;
        height:100vh;
        background:rgba(0,0,0,0.88);
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        font-family:Arial,sans-serif;
        z-index:999999;
        color:#ffffff;
        padding:24px;
      `;

      overlayPeringatan.innerHTML = `
        <div style="
          width:100%;
          max-width:420px;
        ">

          <div style="
            font-size:30px;
            font-weight:800;
            margin-bottom:18px;
          ">
            PERINGATAN ${jumlahPelanggaran}
          </div>

          <div style="
            font-size:21px;
            font-weight:700;
            line-height:1.4;
          ">
            ANDA MENINGGALKAN
            HALAMAN UJIAN
          </div>

          <div style="
            margin-top:16px;
            font-size:17px;
            line-height:1.5;
          ">
            Sistem mendeteksi Anda
            berpindah dari halaman ujian.
          </div>

          <button
            id="tombolPeringatanUjian"
            type="button"
            style="
              margin-top:28px;
              border:none;
              border-radius:14px;
              padding:15px 28px;
              font-size:17px;
              font-weight:800;
              cursor:pointer;
            "
          >
            SAYA PAHAM
          </button>

        </div>
      `;

      document.body.appendChild(
        overlayPeringatan
      );

      document
        .getElementById("tombolPeringatanUjian")
        .addEventListener("click", function () {

          overlayPeringatan.remove();

        });
    }

    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState === "hidden"
        ) {

          halamanMeninggalkanUjian = true;

        } else if (
          document.visibilityState === "visible" &&
          halamanMeninggalkanUjian
        ) {

          halamanMeninggalkanUjian = false;

          tampilkanPeringatanUjian();

        }

      }
    );
    
    // =================================================
    // COUNTDOWN
    // =================================================

    const selisihAwal =
      selesai - sekarang;

    const waktuAkhirLokal =
      Date.now() + selisihAwal;

    function updateCountdown() {

      const sisa =
        waktuAkhirLokal - Date.now();

      if (sisa <= 0) {

  document.body.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      background:#f3f8ff;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-family:Arial,sans-serif;
      z-index:999999;
    ">
      <div>

        <div style="
          font-size:28px;
          font-weight:700;
          margin-bottom:16px;
        ">
          WAKTU UJIAN HABIS
        </div>

        <div style="
          font-size:18px;
          font-weight:500;
        ">
          Waktu pengerjaan telah berakhir.
        </div>

        <div style="
          margin-top:10px;
          font-size:16px;
        ">
          Silakan tunggu arahan dari guru.
        </div>

      </div>
    </div>
  `;

  return;
}

      const totalDetik =
        Math.floor(sisa / 1000);

      const menit =
        Math.floor(totalDetik / 60);

      const detik =
        totalDetik % 60;

      const timer =
        document.getElementById(
          "countdownUjian"
        );

      if (timer) {

        timer.innerText =
          String(menit).padStart(2, "0") +
          ":" +
          String(detik).padStart(2, "0");

      }

      setTimeout(
        updateCountdown,
        250
      );
    }

    updateCountdown();

  };

  // ===================================================
  // PANGGIL API WAKTU DENGAN JSONP
  // ===================================================

  const script =
    document.createElement("script");

  script.src =
    "https://script.google.com/macros/s/AKfycbwxeW6ZSki-s_3m04SUolyJ_Q1zEbGTgNNDDE4J4GVEV-gAyvJaspzzcLRhCFw5OE1yow/exec" +
    "?mode=waktu&callback=" +
    encodeURIComponent(callbackName);

  script.onerror = function () {

    delete window[callbackName];

    hasil.innerHTML = `
      <div style="color:#c62828;">
        WAKTU UJIAN TIDAK DAPAT DIVERIFIKASI
      </div>
    `;

    sedangMemproses = false;
  };

  document.body.appendChild(script);

})
  .catch(function (error) {

    sedangMemproses = false;

    hasil.innerHTML = `
      <div style="color:#c62828;">
        GAGAL MENCATAT NIS
      </div>
    `;

    console.error(error);
  });
},

      function () {
        // Abaikan kesalahan scan sementara
      }
    )
    .then(function () {

      overlay.style.display = "none";

      hasil.innerHTML = `
        <div>
          MENUNGGU SCAN
        </div>
      `;

    })
    .catch(function (error) {

      startScanBtn.disabled = false;
      startScanBtn.innerText = "MULAI SCAN →";

      hasil.innerHTML = `
        <div style="color:#c62828;">
          KAMERA TIDAK DAPAT DIAKTIFKAN
        </div>
      `;

      console.error(error);
    });
  });
</script>
</body>
</html>
