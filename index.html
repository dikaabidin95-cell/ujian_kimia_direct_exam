<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ujian Kimia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f8ff;
      color: #000000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .erlenmeyer-icon {
      width: 58px;
      height: 68px;
      margin: 0 auto 10px;
      color: #168a43;
    }

    .erlenmeyer-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.15;
    }

    .school {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 17px;
      color: #666666;
    }

    .status {
      margin-top: 30px;
      padding: 24px;
      background: #ffffff;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="erlenmeyer-icon">
      <svg
        viewBox="0 0 100 120"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="Labu Erlenmeyer"
      >
        <path
          d="M38 8 H62 V38 L82 91
             C86 102 78 112 67 112
             H33 C22 112 14 102 18 91
             L38 38 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
          stroke-linejoin="round"
        />

        <path
          d="M25 82 H75"
          fill="none"
          stroke="currentColor"
          stroke-width="5"
        />

        <path
          d="M28 75
             C39 70 61 70 72 75"
          fill="none"
          stroke="currentColor"
          stroke-width="4"
        />
      </svg>
    </div>

    <h1>Ujian Kimia</h1>

    <div class="school">
      SMAN 4 TASIKMALAYA
    </div>

    <div class="subtitle">
      Direct Exam
    </div>

    <div class="status">
      SISTEM SIAP
    </div>

  </main>

</body>
</html>
